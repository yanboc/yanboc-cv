<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简历</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/cv.css">
</head>
<body>
  <input id="avatar-file" type="file" accept="image/*" hidden>
  <input id="logo-file" type="file" accept="image/png,image/svg+xml,.png,.svg" hidden>
  <aside class="hud" aria-label="简历填写">
    <div class="hud-rail">
      <p class="hud-brand" data-doc-title>简历</p>
      <p class="hud-lead">网页版只支持部分功能，克隆到本地解锁更多功能。<br>如果你觉得好用，麻烦给我一个免费的<a href="https://github.com/yanboc/yanboc-cv" target="_blank" rel="noopener">星星🧡</a></p>

      <div class="hud-group hud-demo">
        <div class="hud-label">阶段与用途（自动匹配常用模块）</div>
        <select data-stage aria-label="阶段">
          <option value="">-</option>
          <option value="本科">本科</option>
          <option value="硕士">硕士</option>
          <option value="博士">博士</option>
        </select>
        <select data-purpose aria-label="用途">
          <option value="">-</option>
          <option value="学术">学术</option>
          <option value="求职">求职</option>
        </select>
      </div>

      <div class="hud-group">
        <div class="hud-label">填写模块</div>
        <nav class="hud-modules" data-module-nav></nav>
      </div>

      <div class="hud-group">
        <div class="hud-label">导出</div>
        <button type="button" class="hud-wide" data-print>导出 PDF</button>
        <p class="hud-note">文件名跟标题：姓名 + 阶段用途 + 日期。走系统打印对话框。</p>
        <p class="overflow-flag" data-overflow>本页溢出。网页演示仅一页，请删减；多页见 README。</p>
        <p class="hud-status" data-status></p>
      </div>

      <details class="hud-more">
        <summary>预览与其它</summary>
        <div class="hud-group hud-pager">
          <div class="hud-label">翻页</div>
          <div class="hud-row">
            <button type="button" data-prev aria-label="上一页">‹</button>
            <span class="hud-page" data-page-label>1 / 1</span>
            <button type="button" data-next aria-label="下一页">›</button>
          </div>
        </div>
        <div class="hud-group">
          <div class="hud-label">预览缩放</div>
          <div class="hud-row">
            <button type="button" data-zoom-out aria-label="缩小">−</button>
            <span class="hud-zoom" data-zoom-label>适应</span>
            <button type="button" data-zoom-in aria-label="放大">+</button>
          </div>
          <button type="button" class="hud-wide" data-zoom-fit>适应窗口</button>
        </div>
        <div class="hud-group">
          <div class="hud-label">行距</div>
          <select data-rhythm aria-label="行距预设">
            <option value="E" selected>E 选定 1.30 / 0.75 / 1.55</option>
            <option value="A">A 密 1.15 / 0.55 / 1.25</option>
            <option value="B">B 中 1.22 / 0.75 / 1.55</option>
            <option value="C">C 疏 1.30 / 1.00 / 1.90</option>
            <option value="D">D 对比 1.18 / 0.60 / 2.05</option>
          </select>
          <p class="hint" data-rhythm-hint></p>
          <button type="button" class="hud-wide" data-rhythm-save>采用此套</button>
        </div>
        <div class="hud-group">
          <button type="button" class="hud-wide" data-edit>编辑正文</button>
          <button type="button" class="hud-wide" data-save>保存</button>
          <button type="button" class="hud-wide" data-download>下载 HTML</button>
          <p class="hud-note" data-save-hint></p>
        </div>
      </details>
    </div>

    <div class="hud-pane" data-fill-pane hidden>
      <div class="hud-pane-head">
        <span data-fill-title>填写</span>
        <button type="button" data-fill-close aria-label="收起">×</button>
      </div>
      <div class="hud-pane-body" data-fill-form></div>
    </div>
  </aside>

  <div class="deck">
    <div id="pages">
<!-- CV_PAGES_BEGIN -->
      <section class="page theme-image">
        <header class="page-header" data-module="header">
          <div class="brand">
            <img data-logo alt="校徽" hidden>
            <span data-school-name hidden></span>
          </div>
          <div class="dept" data-dept></div>
        </header>
        <div class="watermark"><img data-watermark src="images/school_watermark.png" alt=""></div>
        <div class="page-body">
          <section class="module" data-module="personal">
            <h2 class="module-title"><i class="fa-solid fa-id-card" aria-hidden="true"></i>个人信息</h2>
            <div class="info-wrap">
              <table class="info-table">
                <tr>
                  <td class="label">姓　　名:</td>
                  <td data-bind="name"></td>
                  <td class="label">所在城市:</td>
                  <td data-bind="city"></td>
                </tr>
                <tr>
                  <td class="label">出生年月:</td>
                  <td data-bind="birthdate"></td>
                  <td class="label">联系方式:</td>
                  <td data-bind="contact"></td>
                </tr>
              </table>
              <div class="avatar is-empty" data-avatar>
                <img alt="证件照">
              </div>
            </div>
          </section>
          <section class="module" data-module="education">
            <h2 class="module-title"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>教育背景</h2>
            <article class="entry">
              <div class="spread"><div><strong class="lg" data-f="school">学校</strong>，<span data-f="degree">学位</span></div><div class="meta" data-f="location">位置</div></div>
              <div class="spread"><div><u data-f="college">学院</u>，专业：<span data-f="major">专业名</span></div><div class="meta" data-f="dates">起止时间</div></div>
            </article>
          </section>
          <section class="module" data-module="projects">
            <h2 class="module-title"><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>项目与实习</h2>
            <article class="entry">
              <div class="spread"><div><strong class="lg">项目或实习名称</strong></div><div class="meta">类型</div></div>
              <div class="spread"><div><strong>角色</strong></div><div class="meta">起止时间</div></div>
            </article>
          </section>
          <section class="module others" data-module="others">
            <h2 class="module-title"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>其他</h2>
            <ul>
              <li>在此填写</li>
            </ul>
          </section>
        </div>
        <footer class="page-footer" data-module="footer"></footer>
      </section>
<!-- CV_PAGES_END -->
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
